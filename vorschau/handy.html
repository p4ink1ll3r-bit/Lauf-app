<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handy-Vorschau</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#1b1e23;color:#cdd3da;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:12px 16px}
  .bar button{background:#2a2f36;color:#e6eaee;border:1px solid #3a4048;border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer}
  .bar button[aria-pressed=true]{background:#c6ff3d;color:#10130a;border-color:#c6ff3d;font-weight:600}
  .bar .sep{width:1px;height:22px;background:#3a4048}
  .info{opacity:.7;font-size:12px}
  .stage{flex:1;min-height:0;width:100%;display:flex;align-items:flex-start;justify-content:center;padding:4px 0 16px}
  .scale{transform-origin:top center}
  .phone{position:relative;border-radius:56px;padding:12px;background:#0a0b0d;box-shadow:0 0 0 2px #3a3f46,0 0 0 5px #121417,0 30px 80px rgba(0,0,0,.6)}
  .screen{position:relative;border-radius:44px;overflow:hidden;background:#000;display:flex;flex-direction:column}
  .status{height:48px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font:600 15px system-ui,sans-serif;color:#fff;background:#0b0e11}
  .status.light{background:#e8edf2;color:#10151a}
  .island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#000;border-radius:20px;z-index:2}
  .glyphs{display:flex;gap:6px;align-items:center}
  .batt{width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
  .batt::after{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1.5px;right:5px}
  iframe{border:0;display:block;width:100%;flex:1;background:#0b0e11}
  .home{height:22px;flex:none;display:flex;align-items:center;justify-content:center;background:#0b0e11}
  .home.light{background:#e8edf2}
  .home i{width:36%;height:5px;border-radius:3px;background:#fff;opacity:.85}
  .home.light i{background:#10151a}
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Vorschau-Einstellungen">
  <button data-dev="393x852" aria-pressed="true">iPhone 15</button>
  <button data-dev="412x915" aria-pressed="false">Pixel 8</button>
  <button data-dev="360x740" aria-pressed="false">Kleines Handy</button>
  <button data-dev="768x1024" aria-pressed="false">Tablet</button>
  <span class="sep"></span>
  <button id="theme" aria-pressed="false">Rahmen hell</button>
  <button id="reload">Neu laden</button>
  <span class="info" id="info"></span>
</div>
<div class="stage" id="stage">
  <div class="scale" id="scale">
    <div class="phone" id="phone">
      <div class="screen" id="screen">
        <div class="island" id="island"></div>
        <div class="status" id="status"><span>9:41</span><span class="glyphs"><span>5G</span><span class="batt"></span></span></div>
        <iframe id="app" src="/app/" title="Pacehunt-App"></iframe>
        <div class="home" id="home"><i></i></div>
      </div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let dev="393x852";
function fit(){
  const [w,h]=dev.split("x").map(Number),tablet=w>=700;
  $("screen").style.width=w+"px";$("screen").style.height=h+"px";
  $("phone").style.borderRadius=tablet?"34px":"56px";$("screen").style.borderRadius=tablet?"24px":"44px";
  $("island").style.display=tablet?"none":"block";
  const sc=$("scale"),need=h+24+10,avail=$("stage").clientHeight-8,k=Math.min(1,avail/need);
  sc.style.transform="scale("+k+")";sc.style.height=(need*k)+"px";sc.style.width=(w+24)+"px";
  $("stage").style.alignItems="flex-start";
  $("info").textContent=w+" × "+h+" px"+(k<1?" (angezeigt "+Math.round(k*100)+" %)":"");
}
document.querySelectorAll("[data-dev]").forEach(b=>b.addEventListener("click",()=>{
  dev=b.dataset.dev;document.querySelectorAll("[data-dev]").forEach(x=>x.setAttribute("aria-pressed",x===b));fit()}));
$("theme").addEventListener("click",e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";
  e.currentTarget.setAttribute("aria-pressed",on);e.currentTarget.textContent=on?"Rahmen dunkel":"Rahmen hell";
  $("status").classList.toggle("light",on);$("home").classList.toggle("light",on)});
$("reload").addEventListener("click",()=>{$("app").src=$("app").src});
addEventListener("resize",fit);fit();
</script>
</body>
</html>
