# Prueft jede Nacht die Veranstalterseiten auf Aenderungen (ohne KI, kostenlos) und legt den Bericht ab.
# Aendert nur data/quellen-status.json und docs/AENDERUNGEN.md, nie die Laufdaten (races.json) oder die App.
name: Nächtliche Prüfung der Veranstalterseiten

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC = 03:17 bzw. 04:17 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nachtlauf
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Seiten prüfen
        run: python scripts/aenderungen.py
      - name: Bericht und Stand speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quellen-status.json docs/AENDERUNGEN.md
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu speichern."
          else
            git commit -m "Nächtliche Prüfung der Veranstalterseiten"
            git pull --rebase origin main
            git push origin main
          fi
