# Prueft jede Nacht (ohne KI, kostenlos):
#  1. die Veranstalterseiten auf Aenderungen (scripts/aenderungen.py -> docs/AENDERUNGEN.md)
#  2. die Anmeldeportale: leere Felder fuellen (scripts/portale.py --apply: Anmeldestart/-schluss, Startzeit, Startgeld)
#  3. den Anmeldestatus: ausgebucht / teilweise / wieder frei (scripts/status.py -> docs/STATUS.md, setzt und loescht sold_out)
# Aendern sich Laufdaten (data/races.json), wird die App danach neu veroeffentlicht. Ein Push mit dem GitHub-Token
# startet "deploy" nicht von selbst, deshalb wird es hier ausdruecklich angestossen.
name: Nächtliche Prüfung der Läufe

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC = 03:17 bzw. 04:17 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nachtlauf
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Veranstalterseiten auf Änderungen prüfen
        run: python scripts/aenderungen.py
      - name: Anmeldeportale lesen und leere Felder füllen
        run: python scripts/portale.py --apply
      - name: Anmeldestatus prüfen (ausgebucht, wieder frei)
        run: python scripts/status.py
      - name: Speichern und bei neuen Laufdaten veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races.json data/quellen-status.json data/status-portale.json docs/AENDERUNGEN.md docs/STATUS.md
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu speichern."
            exit 0
          fi
          LAUFDATEN=$(git diff --cached --name-only | grep -c '^data/races.json$' || true)
          git commit -m "Nächtliche Prüfung: Anmeldestatus und Quellen"
          # Hat jemand zwischendurch (von Hand) hochgeladen, gewinnt bei Überschneidungen der frisch geprüfte Nachtstand.
          GESPEICHERT=0
          for versuch in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              GESPEICHERT=1
              break
            fi
            echo "Versuch $versuch fehlgeschlagen, neuer Anlauf."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ "$GESPEICHERT" != 1 ]; then
            echo "Speichern ist nach 3 Versuchen fehlgeschlagen."
            exit 1
          fi
          if [ "$LAUFDATEN" -gt 0 ]; then
            echo "Laufdaten geändert, App wird neu veröffentlicht."
            gh workflow run deploy.yml --ref main
          fi
