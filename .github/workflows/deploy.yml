# Startet bei jeder Aenderung an app/ oder den Laufdaten und von Hand ueber "Run workflow". 
name: App veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["app/**", "data/races.json", "data/plz.json", "scripts/ics.py", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Daten in die App kopieren
        run: |
          mkdir -p app/data
          cp data/races.json data/plz.json app/data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kalenderdateien (.ics) für den iPhone-Kalender erzeugen
        run: python scripts/ics.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
